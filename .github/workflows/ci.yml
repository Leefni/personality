name: CI

on:
  push:
  pull_request:

jobs:
  # ── 1. Frontend ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (syntax + runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Syntax check
        run: bash tests/frontend_syntax_check.sh

      - name: Runtime check
        run: bash tests/frontend_runtime_check.sh

  # ── 2. PHP lint (matrix across supported versions) ────────────────────────
  php-lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql

      - name: Lint all PHP files
        run: |
          find . -name "*.php" -not -path "./vendor/*" \
            | sort \
            | xargs -I{} php -l {} \
            | grep -v "No syntax errors" \
            || true

  # ── 3. API integration tests (matrix across supported versions) ────────────
  api-endpoints:
    name: API endpoint checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: personality
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: personality
      DB_USER: root
      DB_PASS: root
      DB_AUTO_BOOTSTRAP: true

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql

      - name: Resolve BASE_URL
        run: |
          if [ -n "${BASE_URL:-}" ]; then
            echo "BASE_URL=${BASE_URL}" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.BASE_URL }}" ]; then
            echo "BASE_URL=${{ vars.BASE_URL }}" >> "$GITHUB_ENV"
          else
            echo "BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          fi

      - name: Start PHP dev server
        if: ${{ env.BASE_URL == 'http://127.0.0.1:8000' }}
        run: |
          php -S 127.0.0.1:8000 -t . > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid

      - name: Wait for health endpoint
        if: ${{ env.BASE_URL == 'http://127.0.0.1:8000' }}
        run: |
          for i in {1..30}; do
            if curl --fail --silent "${BASE_URL}/api/v1/health.php" > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          cat /tmp/php-server.log || true
          exit 1

      - name: Run API endpoint checks
        run: bash tests/run_api_checks.sh

      - name: Stop PHP dev server
        if: ${{ always() && env.BASE_URL == 'http://127.0.0.1:8000' }}
        run: |
          [ -f /tmp/php-server.pid ] && kill "$(cat /tmp/php-server.pid)" || true

  # ── 4. PHP unit tests ──────────────────────────────────────────────────────
  php-unit:
    name: PHP unit tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: personality
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: personality
      DB_USER: root
      DB_PASS: root
      DB_AUTO_BOOTSTRAP: true

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          tools: phpunit

      - name: Run unit tests
        run: phpunit --bootstrap db_bootstrap.php tests/quiz_service_test.php
