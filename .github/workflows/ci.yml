name: CI

on:
  push:
  pull_request:

jobs:
  # ── 1. Frontend ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (syntax + runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Syntax check
        run: bash tests/frontend_syntax_check.sh

      - name: Runtime check
        run: bash tests/frontend_runtime_check.sh

  # ── 2. PHP lint (matrix across supported versions) ────────────────────────
  php-lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Lint all PHP files
        run: |
          find . -name "*.php" -not -path "./vendor/*" \
            | sort \
            | xargs -I{} php -l {} \
            | grep -v "No syntax errors" \
            || true

  # ── 3. PHP unit tests (pure service logic, no DB dependency) ──────────────
  php-unit:
    name: PHP unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run unit tests
        run: php tests/quiz_service_test.php
